[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reservoir-control"
version = "0.1.0"
description = "Lake Como and Ontario–Ottawa reservoir control experiments for IFT6162"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gym4real==0.1.0",
    "gymnasium==1.1.1",
    "numpy==2.2.4",
    "pandas==2.2.3",
    "PyYAML==6.0.2",
    "pygame==2.6.1",
    "matplotlib==3.10.1",
    "scipy==1.15.3",
]

[dependency-groups]
reproduction = [
    "skrl==1.4.3",
    "torch==2.6.0",
]

[project.scripts]
lake-como-audit = "reservoir_control.systems.lake_como.audit:main"
lake-como-rollout = "reservoir_control.systems.lake_como.baselines:main"
lake-como-mpc = "reservoir_control.systems.lake_como.run_mpc:main"
lake-como-compare = "reservoir_control.systems.lake_como.compare:main"
lake-como-reproduce = "reservoir_control.systems.lake_como.reproduce:main"
lake-como-train-reference = "reservoir_control.systems.lake_como.train_reference:main"
lake-como-seed-study = "reservoir_control.systems.lake_como.seed_study:main"
lake-como-stabilize = "reservoir_control.systems.lake_como.stabilize:main"
lake-como-precision-study = "reservoir_control.systems.lake_como.precision_study:main"
lake-como-entropy-study = "reservoir_control.systems.lake_como.entropy_study:main"
lake-como-inspect-curves = "reservoir_control.systems.lake_como.learning_curves:main"
lake-como-duration-study = "reservoir_control.systems.lake_como.duration_study:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
gym4real = { workspace = true }

[tool.uv.workspace]
members = ["external/gym4real"]
