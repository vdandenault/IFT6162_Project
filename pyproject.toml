[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reservoir-control"
version = "0.1.0"
description = "Ontario–Ottawa reservoir control experiments for IFT6162"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium==1.1.1",
    "numpy==2.2.4",
    "pandas>=2.2.3,<4",
    "PyYAML==6.0.2",
    "matplotlib>=3.10.1,<4",
    "scipy>=1.15.3,<2",
]

[dependency-groups]
dev = ["pytest>=8.3.5,<10"]
jax = ["jax==0.6.2"]
ontario = [
    {include-group = "jax"},
    "metamarl==0.1.0",
    "pandas>=3,<4",
    "toml>=0.10.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reservoir_control", "src/bilevel_reservoirs"]

[tool.uv.sources]
metamarl = { path = "external/metamarl", editable = true }
